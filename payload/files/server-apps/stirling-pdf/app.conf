# Stirling-PDF (idea 54). Recipe settings read by secure-linux-server-apps (contract C12).
# key=value lines, no quotes. The file is read, never run.
title=Stirling-PDF (PDF tools)
about=Join, split, sign, shrink, turn and convert PDF files in your web browser. Your files never leave home.
port=8150
lan_only=yes
# configs: its settings. logs: what it did. Both are handed to your own account (the app runs as you).
data_dirs=configs logs
user_dirs=configs logs
min_free_gb=3
# The log folder is not needed to bring it back, so a backup leaves it out.
backup_include=configs
idea=54
