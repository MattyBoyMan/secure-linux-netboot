# Secure Linux family filter (secure-linux-dns family on): Cloudflare for Families blocks malware AND adult
# sites for every app and every user. While this file exists, a connected VPN does NOT get to answer lookups
# (secure-linux-dns sync takes the VPN's "all names" route away), so the filter can't be bypassed by the VPN.
# Turn off with: secure-linux-dns family off
[Resolve]
DNS=
DNS=1.1.1.3#family.cloudflare-dns.com 1.0.0.3#family.cloudflare-dns.com 2606:4700:4700::1113#family.cloudflare-dns.com 2606:4700:4700::1003#family.cloudflare-dns.com
