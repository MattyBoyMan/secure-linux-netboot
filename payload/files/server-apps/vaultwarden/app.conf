# Vaultwarden (idea 55). Recipe settings read by secure-linux-server-apps (contract C12).
# key=value lines, no quotes. The file is read, never run.
title=Vaultwarden (passwords)
about=Your own private password safe for the whole family. Works with the free Bitwarden apps. Home network only, always over a safe (https) link.
port=8151
# The safe (https) door. The plain port above only sends the browser on to it.
extra_ports=8451/tcp
lan_only=yes
# data: the password safe itself. certs: this app's own home certificate (copy root.crt to your phones, see the guide).
# Both belong to your own account, because Vaultwarden and its https helper run as you, not as the administrator.
data_dirs=data certs certs-config
user_dirs=data certs certs-config
min_free_gb=1
backup_include=data certs
idea=55
