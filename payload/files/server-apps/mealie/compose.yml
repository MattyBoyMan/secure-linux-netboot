# Mealie for Secure Linux: recipes, meal plans and shopping lists. Home network only.
# Started only by secure-linux-server-apps, which fills in the SL_* values from this computer (see app.conf).
# Image pinned by version AND digest (checked 2026-11-16): the official ghcr.io/mealie-recipes/mealie v3.31.0 (the same
# digest is published on Docker Hub as hkotel/mealie:v3.31.0). Licence: AGPL-3.0 (free to use).
# The image starts as the administrator inside the container ONLY to give its folder to you, then runs as your own
# account (PUID/PGID, the project's own docker/entry.sh uses gosu for this).
# Accounts: nobody can sign themselves up. Mealie makes ONE first account with a sign-in that is printed in its own
# guide (changeme@example.com / MyPassword). Sign in with it straight away and change both: see the Secure Linux guide.
# Privacy: no AI service is set up, and only this computer's own address is trusted for forwarded addresses.
services:
  mealie:
    image: ghcr.io/mealie-recipes/mealie:v3.31.0@sha256:97e21ac96e9a8d1ee15aaf558ba3f14998936b9d6f334e40ebb4c6c2127dc12f
    restart: unless-stopped
    ports:
      - "${SL_BIND:?home address missing}:${SL_PORT:?port missing}:9000"
    volumes:
      - "${SL_DATA:?data folder missing}/data:/app/data:Z"
    environment:
      TZ: "${SL_TZ:-UTC}"
      PUID: "${SL_UID:?user missing}"
      PGID: "${SL_GID:?group missing}"
      BASE_URL: "http://${SL_BIND:?home address missing}:${SL_PORT:?port missing}"
      ALLOW_SIGNUP: "false"
      HOST_IP: ""
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW
      - MKNOD
