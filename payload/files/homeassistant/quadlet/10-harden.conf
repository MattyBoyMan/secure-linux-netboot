# Sandbox for the try-it Home Assistant (a Quadlet drop-in). Safe defaults: if the container will not start
# with these, run:  secure-linux-ha local relax   (removes this file) and tell us; the container stays rootless
# and loopback-only either way.
# VERIFY on a real Fedora: Home Assistant's container needs to start as root *inside* its own user namespace; the
# capabilities below are the usual minimum for its init system. Your real user is never given them.
[Container]
NoNewPrivileges=true
DropCapability=ALL
AddCapability=CHOWN DAC_OVERRIDE FOWNER SETUID SETGID KILL SETPCAP
# Cannot eat the whole laptop
PodmanArgs=--memory=1500m --cpus=2 --pids-limit=1024
