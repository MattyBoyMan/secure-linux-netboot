# Paperless-ngx (idea 53). Recipe settings read by secure-linux-server-apps (contract C12).
# key=value lines, no quotes. The file is read, never run.
title=Paperless-ngx
about=Turns paper letters and bills into searchable files. Put scans in its consume folder.
port=8010
lan_only=yes
data_dirs=data media export consume db broker
# You can drop scans into this folder from your own account: /srv/secure-linux/paperless/consume
user_dirs=consume
secrets=db_password secret_key admin_user admin_password
secret_uid=0
min_free_gb=4
# The job queue is rebuilt by itself, so a backup leaves it out.
backup_exclude=broker
idea=53
