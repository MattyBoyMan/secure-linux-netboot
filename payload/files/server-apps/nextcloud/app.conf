# Nextcloud (idea 51). Recipe settings read by secure-linux-server-apps (contract C12).
# key=value lines, no quotes. The file is read, never run.
title=Nextcloud
about=Your own private cloud: files, photos, calendar and contacts, kept on this computer.
port=8088
lan_only=yes
data_dirs=html db
secrets=db_password admin_user admin_password
# Nextcloud reads its password files as the web server user (number 33 inside its container).
secret_uid=33
min_free_gb=4
# Previews are made again by themselves, so a backup leaves them out.
backup_exclude=html/data/appdata_*/preview
idea=51
