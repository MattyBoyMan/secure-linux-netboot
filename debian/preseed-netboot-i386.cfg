#_preseed_V1
# NETBOOT variant (rendered by netboot/render-netboot.sh from the USB preseed): everything comes over the
# internet - there is no USB stick. The early command downloads the Secure Linux payload from the public
# repository (generic files only, no secrets) so the setup screen can run; the late command retries the
# download if the early one could not. Unlike the USB build, your name is NOT preseeded: the Debian
# installer asks for your name, login name and password itself. Nothing is erased without the setup
# screen's drive choice and a typed ERASE.
# Secure Linux: DEBIAN 12 "bookworm" 32-bit (i386) for PCs whose processor is 32-bit only (HW_DISTRO=debian-i386).
# Debian installer preseed file. Used by the USB builder as a Ventoy auto-install template (see debian\INTEGRATION.md).
#
# HONEST WARNING (the setup screen and the setup report repeat it in plain English): Debian 13 has no 32-bit version,
# so this PC gets Debian 12, which is supported until 30 June 2028 (Debian LTS). Web browsers are dropping 32-bit
# Linux. Debian still builds Firefox ESR for 32-bit today, but that can stop before 2028. Until then keep the browser
# updated, and think about a newer PC. Alternative for very old PCs: antiX Linux (offered in the guide, not
# confirmed and not set up by this USB stick).
#
# What this file does: everything that is the same for every person is answered here, so there are NO
# questions about language, mirror, partition layout, packages or boot loader.
# What it deliberately leaves OPEN (the installer, or our setup screen, asks and WAITS; nothing times out):
#   - keyboard layout                       (installer question)
#   - computer name (hostname)              (setup screen: suggested name, press Enter to accept)
#   - the login password for the user       (installer question; passwd/user-password is NOT set here)
#   - which drive is erased + typing ERASE  (setup screen, phase "disk"; partman/confirm is NOT set here)
#   - the disk-encryption passphrase        (setup screen; partman-crypto/passphrase is NOT set here)
# The setup screen (debian\installer\setup-screen.sh) is started by preseed/early_command (phase "start") and
# partman/early_command (phase "disk"). If it is missing, the installer simply asks those questions itself:
# nothing is erased without a drive being chosen and "write the changes?" being confirmed.
# Lines marked "builder:" are replaced by make-usb.ps1 (-Username, -FullName, -Timezone, -Locale).

### Make sure the questions that must wait for the person are actually shown
# (some boot menus pass priority=critical, which would silently use defaults instead of asking)
d-i debconf/priority string high

### Language and country (en_AU = Australian English)
d-i debian-installer/locale string en_AU.UTF-8
d-i debian-installer/language string en
d-i debian-installer/country string AU
d-i localechooser/supported-locales multiselect en_AU.UTF-8
# Keyboard: NOT preseeded, so the installer asks (Australian is pre-selected for en_AU).

### Network
d-i netcfg/choose_interface select auto
d-i netcfg/get_domain string
d-i netcfg/wireless_wep string
# Non-free firmware (Wi-Fi chips etc.): try to load it without asking
d-i hw-detect/load_firmware boolean true
# Computer name: NOT preseeded here (the setup screen suggests one and waits for Enter).

### Package mirror (Debian's own, worldwide). Debian 12 stays on deb.debian.org during its LTS years.
d-i mirror/country string manual
d-i mirror/protocol string http
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/non-free boolean false
d-i apt-setup/contrib boolean false
d-i apt-setup/services-select multiselect security, updates
d-i apt-setup/security_host string security.debian.org

### Accounts: no root login; the first user gets administrator rights (sudo). The name, login name
### and password are all asked by the installer (netboot: a public file can hold none of them).
d-i passwd/root-login boolean false
d-i passwd/make-user boolean true
d-i passwd/user-default-groups string audio cdrom video sudo plugdev netdev

### Clock and time zone
d-i clock-setup/utc boolean true
d-i time/zone string Australia/Melbourne
# (builder: -Timezone replaces the line above)
d-i clock-setup/ntp boolean true

### Disk: whole drive, encrypted (LUKS) with LVM. The drive and the passphrase come from the setup screen.
d-i partman-auto/method string crypto
# 90 percent of the encrypted pool: the spare 10 percent is room for automatic system snapshots before updates
# (secure-linux-snapshot, LVM). "N%" is accepted by partman-auto-lvm (its own help text: enter a percentage, e.g. 20%).
d-i partman-auto-lvm/guided_size string 90%
d-i partman-auto/choose_recipe select atomic
# Don't spend hours overwriting the drive with random data first (a new LUKS key makes old contents unreadable)
d-i partman-auto-crypto/erase_disks boolean false
# NOT set here, on purpose: partman-auto/disk, partman-crypto/passphrase(-again), partman/confirm*,
# partman-lvm/confirm*, partman-lvm/device_remove_lvm, partman-md/device_remove_md.
# The setup screen sets them only AFTER the person typed ERASE.

### Boot loader (old PCs start in BIOS mode; the setup screen sets the boot drive to the one being installed)
d-i grub-installer/only_debian boolean true

### Software: light Xfce desktop (the setup screen swaps it for LXQt below ~900 MB of memory)
tasksel tasksel/first multiselect standard, xfce-desktop
d-i pkgsel/upgrade select full-upgrade
popularity-contest popularity-contest/participate boolean false
# Just enough to run the Secure Linux setup on first start; everything else is installed by it (online).
# (No Flatpak on 32-bit PCs: Flathub has no 32-bit apps.)
d-i pkgsel/include string sudo curl ca-certificates python3 cryptsetup ufw unattended-upgrades libnotify-bin zenity network-manager-gnome

### Secure Linux hooks (files come from the Ventoy injection archive, unpacked at /sl in the installer)
d-i preseed/early_command string sh -c 'mkdir -p /sl; sl_unpack_repo() { archive=$1; destination=$2; expected=$3; names=$archive.names; types=$archive.types; tar -tzf "$archive" > "$names" || return 1; tar -tvzf "$archive" > "$types" || return 1; while IFS= read -r mode rest; do case "$mode" in -*|d*) ;; *) return 1 ;; esac; done < "$types" || return 1; while IFS= read -r path; do case "$path" in "$expected"/*) ;; *) return 1 ;; esac; case "$path" in /*|../*|*/../*|*/..|*\\*|*//*|*/./*|*/.) return 1 ;; esac; done < "$names" || return 1; sort "$names" | uniq -d | grep -q . && return 1; mkdir -p "$destination" || return 1; tar -xzf "$archive" --no-same-owner -C "$destination"; result=$?; rm -f "$names" "$types"; return $result; }; sl_release_matches() { actual=$(grep release_id "$1" | head -n 1 | cut -d \" -f 4); [ "$actual" = "$2" ]; }; rm -rf /tmp/sl-repo; if wget -q -O /tmp/sl-repo.tar.gz https://codeload.github.com/MattyBoyMan/secure-linux-netboot/tar.gz/refs/heads/main && sl_unpack_repo /tmp/sl-repo.tar.gz /tmp/sl-repo secure-linux-netboot-main && cp -a /tmp/sl-repo/secure-linux-netboot-main/payload/debian/. /sl/; then if ! sl_release_matches /sl/payload/release.json secure-linux-2026.11.06-f925a1e49792acd3; then echo "ERROR: downloaded payload is from a different Secure Linux release" >&2; rm -rf /sl; fi; else echo "ERROR: downloaded payload is unsafe or incomplete" >&2; rm -rf /sl; fi; rm -rf /tmp/sl-repo.tar.gz /tmp/sl-repo.tar.gz.names /tmp/sl-repo.tar.gz.types /tmp/sl-repo; if [ -f /sl/setup-screen.sh ]; then sh /sl/setup-screen.sh start; fi'
d-i partman/early_command string if [ -f /sl/setup-screen.sh ]; then sh /sl/setup-screen.sh disk; fi
d-i preseed/late_command string sh -c 'if [ ! -d /sl/payload ]; then mkdir -p /sl; sl_unpack_repo() { archive=$1; destination=$2; expected=$3; names=$archive.names; types=$archive.types; tar -tzf "$archive" > "$names" || return 1; tar -tvzf "$archive" > "$types" || return 1; while IFS= read -r mode rest; do case "$mode" in -*|d*) ;; *) return 1 ;; esac; done < "$types" || return 1; while IFS= read -r path; do case "$path" in "$expected"/*) ;; *) return 1 ;; esac; case "$path" in /*|../*|*/../*|*/..|*\\*|*//*|*/./*|*/.) return 1 ;; esac; done < "$names" || return 1; sort "$names" | uniq -d | grep -q . && return 1; mkdir -p "$destination" || return 1; tar -xzf "$archive" --no-same-owner -C "$destination"; result=$?; rm -f "$names" "$types"; return $result; }; sl_release_matches() { actual=$(grep release_id "$1" | head -n 1 | cut -d \" -f 4); [ "$actual" = "$2" ]; }; rm -rf /tmp/sl-repo; if wget -q -O /tmp/sl-repo.tar.gz https://codeload.github.com/MattyBoyMan/secure-linux-netboot/tar.gz/refs/heads/main && sl_unpack_repo /tmp/sl-repo.tar.gz /tmp/sl-repo secure-linux-netboot-main && cp -a /tmp/sl-repo/secure-linux-netboot-main/payload/debian/. /sl/; then if ! sl_release_matches /sl/payload/release.json secure-linux-2026.11.06-f925a1e49792acd3; then echo "ERROR: downloaded payload is from a different Secure Linux release" >&2; rm -rf /sl; fi; else echo "ERROR: downloaded payload is unsafe or incomplete" >&2; rm -rf /sl; fi; rm -rf /tmp/sl-repo.tar.gz /tmp/sl-repo.tar.gz.names /tmp/sl-repo.tar.gz.types /tmp/sl-repo; fi; if [ -f /sl/late.sh ]; then sh /sl/late.sh; fi'

### Finish: turn off (not restart) so the USB stick can be removed before the first start
d-i finish-install/reboot_in_progress note
d-i debian-installer/exit/poweroff boolean true
