# Mealie (idea 56). Recipe settings read by secure-linux-server-apps (contract C12).
# key=value lines, no quotes. The file is read, never run.
title=Mealie (recipes and meal plans)
about=Recipes, a weekly meal plan and a shopping list for the whole family, in one place. Home network only.
port=8153
lan_only=yes
# data: recipes, pictures and settings. Handed to your own account (the app runs as you).
data_dirs=data
user_dirs=data
min_free_gb=2
backup_include=data
idea=56
# first_signin: shown by the tool at set-up and by 'login' (text only). Mealie makes its first account with a public
# sign-in and pre-fills it on its sign-in page; its own first-time setup page then changes the email and password.
first_signin=Mealie starts with a public sign-in that anyone on your home Wi-Fi could use: email changeme@example.com, password MyPassword. Open Mealie now and sign in with it. Mealie then shows its first-time setup: in Account Details set your own email and a new password.
