# Secure Linux network privacy (installed by steps/20-network.sh)
#  - a different, made-up Wi-Fi/Ethernet hardware address (MAC) for every network, kept stable per network
#    so home routers still recognise the laptop
#  - random addresses while scanning for networks
#  - the computer's name is not sent to the network (DHCP)
#  - IPv6 privacy addresses (they change regularly)
[device-secure-linux-privacy]
wifi.scan-rand-mac-address=yes

[connection-secure-linux-privacy]
wifi.cloned-mac-address=stable
ethernet.cloned-mac-address=stable
ipv4.dhcp-send-hostname=false
ipv6.dhcp-send-hostname=false
ipv6.ip6-privacy=2
connection.llmnr=0
