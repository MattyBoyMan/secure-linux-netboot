# Uptime Kuma for Secure Linux: health checks for your home apps and websites. Home network only.
# Started only by secure-linux-server-apps, which fills in the SL_* values from this computer (see app.conf).
# Image pinned by version AND digest (checked on Docker Hub, 2026-11-16): the official louislam/uptime-kuma
# 2.5.11-slim-rootless (the small edition that never runs as the administrator). Licence: MIT (free to use).
# It runs as your own account with every extra right removed. Plain "ping" checks work without extra rights because
# this container (only) allows ping for normal users (net.ipv4.ping_group_range, which stays inside the container).
# The first person to open it makes the first account: do that yourself straight away.
services:
  uptime-kuma:
    image: docker.io/louislam/uptime-kuma:2.5.11-slim-rootless@sha256:ebc6299a1bc8bd4a29e0bddcc04f11440e3690b1c52e19558006eeefb5a8b019
    restart: unless-stopped
    user: "${SL_UID:?user missing}:${SL_GID:?group missing}"
    ports:
      - "${SL_BIND:?home address missing}:${SL_PORT:?port missing}:3001"
    volumes:
      - "${SL_DATA:?data folder missing}/data:/app/data:Z"
    environment:
      TZ: "${SL_TZ:-UTC}"
    sysctls:
      net.ipv4.ping_group_range: "0 2147483647"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
