# Jellyfin (idea 52). Recipe settings read by secure-linux-server-apps (contract C12).
# key=value lines, no quotes. The file is read, never run.
title=Jellyfin
about=Your own private streaming for films, shows and music. Copy your videos into its media folder.
port=8096
lan_only=yes
data_dirs=config cache media
# These folders belong to your own account, because Jellyfin runs as you and not as the administrator.
# Put your films and shows in /srv/secure-linux/jellyfin/media (the app can only read them, never change them).
user_dirs=config cache media
min_free_gb=4
# Only the settings and library are backed up: your own media files stay where they are, and the cache is made again.
backup_include=config
idea=52
