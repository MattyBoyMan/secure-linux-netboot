# Secure Linux SSH settings (older PCs only; installed by steps/25-security.sh).
# SSH is only reachable on your home network (firewall "home" zone).
PermitRootLogin no
MaxAuthTries 3
X11Forwarding no
LoginGraceTime 30
# Later, once your keys are on this PC (the fleet tool does this), passwords can be switched off:
#   secure-linux-fleet writes /etc/ssh/sshd_config.d/30-secure-linux-keys-only.conf with
#   PasswordAuthentication no  and  KbdInteractiveAuthentication no
