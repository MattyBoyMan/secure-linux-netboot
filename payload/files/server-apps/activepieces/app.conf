# Activepieces (idea 59). Recipe settings read by secure-linux-server-apps (contract C12).
# key=value lines, no quotes. The file is read, never run.
title=Activepieces (automations)
about=Makes your apps work together by themselves: "when this happens, do that". No code needed. Home network only.
port=8156
lan_only=yes
# config: its database, settings and its own private keys (made on this computer). cache: add-ons it downloads.
# Both are handed to your own account (the app runs as you).
data_dirs=config cache
user_dirs=config cache
min_free_gb=4
# The add-on cache is downloaded again by itself, so a backup leaves it out.
backup_include=config
idea=59
