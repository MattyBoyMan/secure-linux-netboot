# changedetection.io for Secure Linux: watches web pages and tells you when one changes. Home network only.
# One recipe file: the x-secure-linux block below is read by secure-linux-server-apps, which fills in the SL_* values.
# Image pinned by version AND digest (checked on Docker Hub, 2026-11-16): official dgtlmoon/changedetection.io 0.70.3
# (the same image as their "latest" tag on that day). Licence: Apache-2.0. Runs as your own account.
# Privacy: its version check ("telemetry") is OFF, the AI features are OFF, and watched sites are not told which
# address you came from (HIDE_REFERER). It has no password at first: open Settings and set one straight away.
# Watching pages on your own home network is blocked by the app unless you change that; this recipe leaves it blocked.
# Pages that need a real browser to draw (heavy JavaScript) are not supported here: that needs a second container.
x-secure-linux:
  title: changedetection.io (page watcher)
  about: Watches web pages and tells you when one changes. Home network only.
  port: 8143
  lan_only: yes
  data_dirs: datastore
  user_dirs: datastore
  backup_include: datastore
  min_free_gb: 2
  idea: X1
services:
  changedetection:
    image: docker.io/dgtlmoon/changedetection.io:0.70.3@sha256:47b1e9cc3eff820e6022b655e3fcc948625f60c1770ae8b9c30aa3bf104dc255
    restart: unless-stopped
    user: "${SL_UID:?user missing}:${SL_GID:?group missing}"
    ports:
      - "${SL_BIND:?home address missing}:${SL_PORT:?port missing}:5000"
    volumes:
      - "${SL_DATA:?data folder missing}/datastore:/datastore:Z"
    environment:
      TZ: "${SL_TZ:-UTC}"
      PORT: "5000"
      LISTEN_HOST: "0.0.0.0"
      BASE_URL: "http://${SL_BIND:?home address missing}:${SL_PORT:?port missing}"
      DISABLE_VERSION_CHECK: "true"
      LLM_FEATURES_DISABLED: "true"
      LITELLM_FETCH_PRICING_FROM_GITHUB: "false"
      HIDE_REFERER: "true"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
