# Secure Linux: encrypted DNS for every app (installed by steps/20-network.sh).
# Cloudflare 1.1.1.2 blocks known malware sites; Quad9 (also malware-blocking) is the second choice.
# Domains=~. sends every lookup here instead of to the Wi-Fi network's own DNS (which is not encrypted).
# While a VPN is connected, secure-linux-dns writes /run/systemd/resolved.conf.d/50-secure-linux-vpn.conf
# ("Domains=") so the VPN's own DNS (NordVPN Threat Protection, Cloudflare Zero Trust rules) wins.
# Hotel Wi-Fi login page won't load? Use "Hotel / Cafe Wi-Fi Login" in the app menu.
[Resolve]
DNS=1.1.1.2#security.cloudflare-dns.com 1.0.0.2#security.cloudflare-dns.com 2606:4700:4700::1112#security.cloudflare-dns.com 2606:4700:4700::1002#security.cloudflare-dns.com 9.9.9.9#dns.quad9.net 149.112.112.112#dns.quad9.net 2620:fe::fe#dns.quad9.net 2620:fe::9#dns.quad9.net
FallbackDNS=
DNSOverTLS=yes
DNSSEC=allow-downgrade
Domains=~.
LLMNR=no
