# Actual Budget (idea 56). Recipe settings read by secure-linux-server-apps (contract C12).
# key=value lines, no quotes. The file is read, never run.
title=Actual Budget (money)
about=A private budget for your household: where the money goes, and what is left. Home network only, over a safe (https) link.
port=8152
# The safe (https) door. Actual needs https to work from other devices; the plain port above only sends the browser on.
extra_ports=8452/tcp
lan_only=yes
# data: your budgets. certs: this app's own home certificate (see the guide). Both belong to your own account.
data_dirs=data certs certs-config
user_dirs=data certs certs-config
min_free_gb=1
backup_include=data certs
idea=56
