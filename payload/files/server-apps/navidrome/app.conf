# Navidrome (idea 52). Recipe settings read by secure-linux-server-apps (contract C12).
# key=value lines, no quotes. The file is read, never run.
title=Navidrome
about=Your own private music streaming. Copy your music into its music folder and play it on any device at home.
port=4533
lan_only=yes
data_dirs=data music
# These folders belong to your own account, because Navidrome runs as you and not as the administrator.
# Put your music in /srv/secure-linux/navidrome/music (the app can only read it, never change it).
user_dirs=data music
min_free_gb=2
# Only the settings and library list are backed up: your own music files stay where they are.
backup_include=data
idea=52
