# Audiobookshelf (idea 52). Recipe settings read by secure-linux-server-apps (contract C12).
# key=value lines, no quotes. The file is read, never run.
title=Audiobookshelf
about=Your own private shelf for audiobooks and podcasts. Copy your audiobooks into its audiobooks folder.
port=13378
lan_only=yes
data_dirs=config metadata audiobooks podcasts
# These folders belong to your own account, because Audiobookshelf runs as you and not as the administrator.
# Put your audiobooks in /srv/secure-linux/audiobookshelf/audiobooks (the app can only read them, never change them).
user_dirs=config metadata audiobooks podcasts
min_free_gb=2
# Only the settings and library are backed up: your own audiobooks and podcasts stay where they are.
backup_include=config metadata
idea=52
